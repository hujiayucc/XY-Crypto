name: XY Crypto Code Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.4'

permissions:
  contents: read

jobs:
  code-check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-pub
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Node tests
