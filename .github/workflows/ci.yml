name: XY Crypto CI Preview Builds

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.4'
  DART_VERSION: '3.9.2'
  APP_VERSION: '1.3.2'
  BUILD_NUMBER: '181'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: node --test server/test/*.test.mjs

  android:
    name: Android ${{ matrix.abi }}
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm32
            flutter_arch: arm
            artifact: XY加密-android-armeabi-v7a
          - abi: arm64
            flutter_arch: arm64
            artifact: XY加密-android-arm64-v8a
          - abi: x86_64
            flutter_arch: x64
            artifact: XY加密-android-x86_64
          - abi: all
            flutter_arch: all
            artifact: XY加密-android-all
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Restore optional Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Android signing secrets are absent; the release artifact will use the Gradle debug key.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/ci-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ci-upload.jks
          EOF
      - name: Build APK
        shell: bash
        run: |
          if [ "${{ matrix.flutter_arch }}" = all ]; then
            flutter build apk --release --no-pub
          else
            flutter build apk --release --no-pub --target-platform android-${{ matrix.flutter_arch }}
          fi
      - name: Rename APK
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-release.apk "${{ matrix.artifact }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.apk

  windows:
    name: Windows ${{ matrix.arch }}
    needs: analyze
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            flutter_arch: x64
            vs_arch: x64
            custom_flutter: false
            flutter_version: 3.35.4
            dart_version: 3.9.2
          - arch: arm64
            runner: windows-11-arm
            flutter_arch: arm64
            vs_arch: arm64
            custom_flutter: true
            flutter_version: 3.47.7
            dart_version: 3.13.5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter x64
        if: ${{ !matrix.custom_flutter }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable
          cache: true
      - name: Use Flutter source tool on Windows
        if: ${{ !matrix.custom_flutter }}
        shell: pwsh
        run: pwsh -File tool/setup_flutter_windows.ps1 $env:FLUTTER_ROOT
      - name: Set up Dart ARM64
        if: ${{ matrix.custom_flutter }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart_version }}
          architecture: arm64
      - name: Set up Flutter ARM64
        if: ${{ matrix.custom_flutter }}
        shell: pwsh
        run: pwsh -File tool/setup_flutter_windows_arm64.ps1 ${{ matrix.flutter_version }} ${{ matrix.dart_version }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vs_arch }}
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Build portable bundle
        shell: pwsh
        run: flutter build windows --release --no-pub
      - name: Verify Windows executable architecture
        shell: pwsh
        run: |
          $exe = "build/windows/${{ matrix.flutter_arch }}/runner/Release/xy_encrypt_app.exe"
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD $exe))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550) { throw 'Invalid PE signature' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('Unexpected PE machine: 0x{0:X4}' -f $machine) }
          Write-Host ('Verified ${{ matrix.arch }} executable: PE machine 0x{0:X4}' -f $machine)
      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          WINDOWS_SIGNING_ALLOW_UNTRUSTED: 'true'
        run: pwsh -File tool/sign_windows.ps1 "${{ github.workspace }}\build\windows\${{ matrix.flutter_arch }}\runner\Release\xy_encrypt_app.exe"
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $bundle = "build/windows/${{ matrix.flutter_arch }}/runner/Release"
          if (!(Test-Path $bundle)) { throw "Windows bundle not found: $bundle" }
          New-Item -ItemType Directory -Force -Path ci-dist | Out-Null
          Compress-Archive -Path "$bundle\*" -DestinationPath "ci-dist/XY加密-windows-${{ matrix.arch }}.zip" -Force
      - name: Build setup.exe
        shell: pwsh
        run: |
          $bundle = "${{ github.workspace }}\build\windows\${{ matrix.flutter_arch }}\runner\Release"
          if (!(Test-Path $bundle)) { throw "Windows bundle not found: $bundle" }
          $out = "${{ github.workspace }}\ci-dist"
          $env:BUILD_DIR = $bundle
          $env:OUTPUT_DIR = $out
          $env:ARCH_LABEL = '${{ matrix.arch }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/xy_encrypt_app.iss
      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          WINDOWS_SIGNING_ALLOW_UNTRUSTED: 'true'
        run: pwsh -File tool/sign_windows.ps1 "${{ github.workspace }}\ci-dist\XY加密-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: XY加密-windows-${{ matrix.arch }}
          path: ci-dist/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: analyze
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            flutter_arch: x64
            deb_arch: amd64
            custom_flutter: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
            deb_arch: arm64
            custom_flutter: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter x64
        if: ${{ !matrix.custom_flutter }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up Dart ARM64
        if: ${{ matrix.custom_flutter }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
          architecture: arm64
      - name: Set up Flutter ARM64
        if: ${{ matrix.custom_flutter }}
        shell: bash
        run: bash tool/setup_flutter_linux_arm64.sh "$FLUTTER_VERSION" "$DART_VERSION"
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev dpkg-dev rpm zstd xz-utils qemu-user-static
      - run: flutter config --enable-linux-desktop
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Build native Linux bundle
        shell: bash
        run: |
          flutter build linux --release --no-pub --target-platform linux-${{ matrix.flutter_arch }}
      - name: Package Linux portable tarball and deb
        shell: bash
        run: |
          set -eux
          mkdir -p ci-dist
          bundle="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [ ! -d "$bundle" ]; then
            echo "Linux bundle not found: $bundle" >&2
            exit 1
          fi
          APP_VERSION="${{ env.APP_VERSION }}" bash packaging/linux/build-packages.sh "$bundle" ci-dist "${{ matrix.deb_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: XY加密-linux-${{ matrix.arch }}
          path: ci-dist/*

  apple:
    name: Apple CI archives
    needs: analyze
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Configure iOS signing when materials are available
        id: ios_signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
          IOS_CODE_SIGN_IDENTITY: ${{ vars.IOS_CODE_SIGN_IDENTITY }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] && [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo 'iOS signing materials are absent; producing a locally ad-hoc signed IPA archive.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo 'iOS signing materials are incomplete.' >&2
            exit 1
          fi
          bash tool/configure_ios_signing.sh
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Build iOS package
        id: ios_build
        shell: bash
        env:
          IOS_SIGNING_ENABLED: ${{ steps.ios_signing.outputs.enabled }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" = true ]; then
            flutter build ipa --release --no-pub --export-options-plist=ios/ExportOptions.plist
            ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
            if [ -z "$ipa_path" ]; then
              echo 'flutter build ipa did not produce an IPA.' >&2
              exit 1
            fi
            echo "ios_ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          else
            flutter build ios --release --no-codesign --no-pub
            bash tool/self_sign_ios.sh build/ios/iphoneos/Runner.app
          fi
      - name: Build macOS archive
        run: flutter build macos --release --no-pub
      - name: Package Apple archives with detected architecture
        id: apple_packages
        shell: bash
        env:
          IOS_IPA_PATH: ${{ steps.ios_build.outputs.ios_ipa_path }}
        run: bash packaging/apple/build-archives.sh ci-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apple_packages.outputs.ios_name }}
          path: ci-dist/${{ steps.apple_packages.outputs.ios_file }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apple_packages.outputs.macos_name }}
          path: ci-dist/${{ steps.apple_packages.outputs.macos_name }}.zip
          if-no-files-found: error
      - name: Clean temporary iOS signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${IOS_SIGNING_KEYCHAIN:-}" ] && [ -e "$IOS_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${IOS_SIGNING_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_SIGNING_PROFILE_PATH"
          fi
          rm -f ios/Flutter/Signing.xcconfig ios/ExportOptions.plist

  preview_release:
    name: Publish CI preview release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [android, windows, linux, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-ci-${{ github.run_number }}
          name: XY Crypto CI Preview ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: release-assets/*