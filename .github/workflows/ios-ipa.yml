name: XY Crypto iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  build:
    name: Build iOS IPA archive
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: node tool/build_legal_site.cjs
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Apply local ad-hoc signature
        run: bash tool/self_sign_ios.sh build/ios/iphoneos/Runner.app
      - name: Package IPA archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-dist
          mkdir -p ci-dist/Payload
          cp -R build/ios/iphoneos/*.app ci-dist/Payload/
          (cd ci-dist && zip -qry XY加密-ios-arm64.ipa Payload)
          rm -rf ci-dist/Payload
      - name: Verify and name IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find ci-dist -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo 'No IPA was produced.' >&2
            exit 1
          fi
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          unzip -q "$ipa_path" -d "$inspect_dir"
          app_path="$(find "$inspect_dir/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo 'IPA does not contain an application bundle.' >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          arch="$(lipo -archs "$app_path/$executable")"
          case "$arch" in
            arm64) label=arm64 ;;
            *)
              echo "Unexpected iOS architecture: $arch" >&2
              exit 1
              ;;
          esac
          echo 'Local ad-hoc IPA; Apple provisioning is not included.'
          codesign --verify --deep --strict "$app_path"
          ipa_name="XY加密-ios-${label}.ipa"
          cp "$ipa_path" "$ipa_name"
          echo "ipa_name=$ipa_name" >> "$GITHUB_OUTPUT"
          echo "Verified local ad-hoc IPA: $ipa_name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
      - name: Clean temporary iOS signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${IOS_SIGNING_KEYCHAIN:-}" ] && [ -e "$IOS_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$IOS_SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${IOS_SIGNING_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_SIGNING_PROFILE_PATH"
          fi
          rm -f ios/Flutter/Signing.xcconfig ios/ExportOptions.plist
